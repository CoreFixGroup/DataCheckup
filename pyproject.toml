[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "datacheckup"
version = "0.1.0"
description = "Find the exact row and column of every error in a CSV or JSON file, with no setup and no database."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Corefix Group" }]
maintainers = [{ name = "Corefix Group" }]
keywords = ["data quality", "csv", "json", "validation", "data cleaning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/CoreFixGroup/DataCheckup"
Repository = "https://github.com/CoreFixGroup/DataCheckup"
Issues = "https://github.com/CoreFixGroup/DataCheckup/issues"

[tool.setuptools]
packages = ["datacheckup"]
